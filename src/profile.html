<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TanoScene - Profile</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

    <main class="profile-container">
        <div class="profile-banner">
            <img src="../images/banner-placeholder.png" alt="Profile Banner" id="bannerImage">
        </div>

        <section class="profile-header">
            <div class="profile-avatar" id="avatarWrapper">
                <img src="../images/avatar-placeholder.png" alt="Profile Avatar" id="avatarImage">
            </div>

            <div class="profile-info">
                <h2 id="username">@tano_user</h2>

                <p class="bio" id="bioText">
                    This is a bio! It could describe you, your hobbies, or anything you like.
                </p>
                <textarea class="bio-edit" id="bioEdit" style="display: none;"></textarea>

                <button class="edit-profile-button" id="editProfileBtn">Edit Profile</button>
            </div>
        </section>

        <input type="file" id="avatarInput" accept="image/*" hidden>
        <input type="file" id="bannerInput" accept="image/*" hidden>

        <section class="profile-posts">
            <h3>Posts</h3>
            <!-- User posts will be dynamically inserted here -->
             <div class="posts-list"></div> <!-- Container for dynamic posts -->
        </section>

        </main>

        <footer>
            <p>&copy; 2025 TanoScene</p>
        </footer>

    <script type="module">
        import { requireAuth } from "../common/auth.js";
        import addNavbar from "../common/navbar.js";
        import { renderPosts } from "../common/postComponent.js";

        requireAuth();
        addNavbar();

        const userPosts = [ //Example user posts (replace with real data later)
            {
                username: "tano-user",
                avatar: "../images/avatar-placeholder.png",
                date: "October 21, 2025",
                content: "Here's a more recent post!"
            },
            {
                username: "tano-user",
                avatar: "../images/avatar-placeholder.png",
                date: "October 20, 2025",
                content: "This is my first post!"
            }
        ];

        const postsContainer = document.querySelector(".profile-posts .posts-list");
        renderPosts(postsContainer, userPosts);

        /* Edit mode logic below */
        const editBtn = document.getElementById("editProfileBtn");
        const avatar = document.getElementById("avatarImage");
        const banner = document.getElementById("bannerImage");
        const bioText = document.getElementById("bioText");
        const bioEdit = document.getElementById("bioEdit");
        const avatarInput = document.getElementById("avatarInput");
        const bannerInput = document.getElementById("bannerInput");

        let editing = false;

        editBtn.addEventListener("click", () => {
            editing = !editing;

            if (editing) {
                enterEditMode();
            } else {
                saveProfileChanges();
            }
        });

        function enterEditMode() {
            editBtn.textContent = "Save Changes";

            //Make avatar clickable
            avatar.classList.add("editable");
            avatar.onclick = () => avatarInput.click();

            //Make banner clickable
            banner.classList.add("editable");
            banner.onclick = () => bannerInput.click();

            //Enable bio editing
            bioEdit.value = bioText.textContent;
            bioText.style.display = "none";
            bioEdit.style.display = "block";
            bioEdit.focus();
        }

        avatarInput.addEventListener("change", () => {
            const file = avatarInput.files[0];
            if (file) avatar.src = URL.createObjectURL(file);
        });

        bannerInput.addEventListener("change", () => {
            const file = bannerInput.files[0];
            if (file) banner.src = URL.createObjectURL(file);
        });

        function saveProfileChanges() {
            editBtn.textContent = "Edit Profile";

            avatar.classList.remove("editable");
            avatar.onclick = null;

            banner.classList.remove("editable");
            banner.onclick = null;

            //Save bio text
            bioText.textContent = bioEdit.value;
            bioEdit.style.display = "none";
            bioText.style.display = "block";

            //For the future: send these changes to backend
            console.log("Saved bio: ", bioText.textContent);
            console.log("Avatar src: ", avatar.src);
            console.log("Banner src: ", banner.src);
        }

    </script>

</body>
</html>
